services:
  postgres:
    image: postgres:16
    container_name: phoneme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: phoneme_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d phoneme_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: phoneme-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/phoneme_builder
    ports:
      - "4080:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4080
    container_name: phoneme-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    depends_on:
      - api

volumes:
  postgres_data: